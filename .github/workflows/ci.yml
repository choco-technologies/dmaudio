name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: chocotechnologies/dmod:1.0.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clear the dmf-get cache
        run: |
          # The image may carry manifests cached before the versions it needs
          dmf-get --clear-cache

      - name: Build libdmaudio, dmaudio and the tools
        run: |
          mkdir -p build
          cd build
          cmake .. -DDMOD_MODE=DMOD_MODULE
          cmake --build .

      - name: Verify module files
        run: |
          echo "Checking for module files..."
          ls -lh build/dmf/
          for m in libdmaudio dmaudio audiotone audioplay audioctl test_libdmaudio; do
            test -f build/dmf/$m.dmf
          done
          test -f build/dmf/libdmaudio_version.txt
          echo "Module files present"

      - name: Run tests with dmod_loader
        run: |
          export DMOD_DMF_DIR=$(pwd)/build/dmf
          dmf-get install -d ${DMOD_DMF_DIR}/test_libdmaudio-local.dmd -y
          dmod_loader build/dmf/test_libdmaudio.dmf
