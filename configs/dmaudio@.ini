; dmaudio@.ini - libsystemd unit template, one instance per audio device.
;
; Not started on its own: dmdevfs reports every node that answers
; DMDRVI_IOCTL_AUDIO_GET_INFO (a codec) as an "audio" class device, and
; dmaudio.rules maps that class here, so libsystemd instantiates
; dmaudio@<name> for each.
;
; %i is the device's name (its node name, e.g. "wm8994"), %v its node path
; ("/dev/wm8994"). Options after them (see libdmaudio_serve_parse()):
;   -r RATE  -c CHANNELS  -b BITS  -o headphone|speaker|line  -v VOLUME
;   -p PERIOD_MS  -i IDLE_MS  -t TIMEOUT_MS
; e.g. args=%i %v -r 44100 -v 50
description=dmaudio on audio device %i
exec=dmaudio
args=%i %v
type=simple
