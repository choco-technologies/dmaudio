; speaker/dmaudio@.ini - dmaudio@.ini for a device that plays through its
; speaker output. The same unit (dmaudio@<name>, started by dmaudio.rules) -
; a firmware takes one or the other in its .dmd:
;
;   dmaudio service=dmaudio@.ini            ; headphone
;   dmaudio service=speaker/dmaudio@.ini    ; speaker
;
; Either installs as dmaudio@.ini. The output can be switched while the
; device plays: audioctl output [DEVICE] headphone|speaker|line, or
; libdmaudio_device_set_output(). Options: see ../dmaudio@.ini.
description=dmaudio on audio device %i (speaker)
exec=dmaudio
args=%i %v -o speaker
type=simple
